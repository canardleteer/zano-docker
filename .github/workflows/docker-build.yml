name: docker build

env:
    BUILD_WIDTH: 8

on:
  pull_request:
    branches: [ "main" ]

jobs:
  docker-build:
    # Stable check names for branch rules: "release (amd64)", "release (arm64)",
    # "release - 1 (amd64)", "release - 1 (arm64)". Slide zano-ref when bumping;
    # leave channel/arch as-is.
    name: ${{ matrix.channel }} (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - channel: release
            arch: amd64
            zano-ref: 2.2.1.506
            platform: linux/amd64
          - channel: release
            arch: arm64
            zano-ref: 2.2.1.506
            platform: linux/arm64
          - channel: release - 1
            arch: amd64
            zano-ref: 2.2.1.505
            platform: linux/amd64
          - channel: release - 1
            arch: arm64
            zano-ref: 2.2.1.505
            platform: linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: setup qemu
        uses: docker/setup-qemu-action@v4

      - name: setup buildx
        uses: docker/setup-buildx-action@v4

      - name: Set SHA_SHORT for commit
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: "build target: zano-runner"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_WIDTH=${{ env.BUILD_WIDTH }}
            ZANO_REF=${{ matrix.zano-ref }}
          tags: ${{ vars.DOCKERHUB_REPO }}:${{ matrix.zano-ref }}-zano-runner,${{ vars.DOCKERHUB_REPO }}:${{ matrix.zano-ref }}-zano-runner-${{ steps.vars.outputs.sha_short }}
          target: zano-runner
          # provenance: mode=max
          # sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "simple test: zano-runner"
        run: |
          docker run --rm --platform ${{ matrix.platform }} ${{ vars.DOCKERHUB_REPO }}:${{ matrix.zano-ref }}-zano-runner-${{ steps.vars.outputs.sha_short }} --version

      - name: "build target: zanod-distroless"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_WIDTH=${{ env.BUILD_WIDTH }}
            ZANO_REF=${{ matrix.zano-ref }}
          tags: ${{ vars.DOCKERHUB_REPO }}:${{ matrix.zano-ref }}-zanod-distroless,${{ vars.DOCKERHUB_REPO }}:${{ matrix.zano-ref }}-zanod-distroless-${{ steps.vars.outputs.sha_short }}
          target: zanod-distroless
          # provenance: mode=max
          # sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "simple test: zanod-distroless"
        run: |
          docker run --rm --platform ${{ matrix.platform }} ${{ vars.DOCKERHUB_REPO }}:${{ matrix.zano-ref }}-zanod-distroless-${{ steps.vars.outputs.sha_short }} --version

      - name: "build target: simplewallet-distroless"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_WIDTH=${{ env.BUILD_WIDTH }}
            ZANO_REF=${{ matrix.zano-ref }}
          tags: ${{ vars.DOCKERHUB_REPO }}:${{ matrix.zano-ref }}-simplewallet-distroless,${{ vars.DOCKERHUB_REPO }}:${{ matrix.zano-ref }}-simplewallet-distroless-${{ steps.vars.outputs.sha_short }}
          target: simplewallet-distroless
          # provenance: mode=max
          # sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "simple test: zanod-distroless"
        run: |
          docker run --rm --platform ${{ matrix.platform }} ${{ vars.DOCKERHUB_REPO }}:${{ matrix.zano-ref }}-simplewallet-distroless-${{ steps.vars.outputs.sha_short }} --version
